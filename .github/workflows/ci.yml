name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [oyster]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: marker_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print Go Environment
        run: |
          go version
          go env GOPATH GOMODCACHE GOCACHE

      - name: Run backend tests
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
          MCP_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/marker_mcp_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: Verify coverage file exists
        run: test -s coverage.out

  go-vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
        run: |
          set +e
          govulncheck ./... | tee govulncheck.txt
          GOVULN_EXIT=$?
          set -e

          if [ "$GOVULN_EXIT" -ne 0 ]; then
            echo "govulncheck detected vulnerabilities. Keeping CI green while remediation is in progress."
            {
              echo "### govulncheck findings (non-blocking)"
              echo ""
              echo "govulncheck exited with code $GOVULN_EXIT."
              echo ""
              echo '```'
              cat govulncheck.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  gosec:
    name: Go Static Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0

      - name: Run gosec and verify analysis completed
        run: |
          set +e
          gosec -fmt=json -out=gosec.json ./...
          SCAN_EXIT=$?
          set -e
          export SCAN_EXIT
          python3 - <<'PYSCAN'
          import json, os
          from pathlib import Path
          report = json.loads(Path('gosec.json').read_text())
          errors = report.get('Golang errors') or {}
          if errors:
              raise SystemExit('gosec package analysis failed: ' + json.dumps(errors))
          stats = report.get('Stats', {})
          if not stats.get('files', 0):
              raise SystemExit('gosec analyzed no files')
          if int(os.environ['SCAN_EXIT']) not in (0, 1):
              raise SystemExit('gosec failed unexpectedly: ' + os.environ['SCAN_EXIT'])
          issues = report.get('Issues', [])
          print(json.dumps({'stats': stats, 'findings': len(issues)}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### gosec analysis completed\n\n')
              out.write(f"Analyzed {stats.get('files')} files; {len(issues)} findings. Findings remain non-blocking under the existing legacy-remediation policy; analyzer failures are blocking. See gosec-report artifact.\n")
          PYSCAN

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec.json

  go-mod-tidy-check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

