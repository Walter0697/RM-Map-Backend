name: Backend Delivery

on:
  push:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Backend Image
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend version source
        run: |
          grep -q 'current_version := ' server.go || {
            echo "Could not find current_version in server.go" >&2
            exit 1
          }

      - name: Extract image metadata
        id: meta
        run: |
          VERSION=$(grep -Eo 'current_version := "[^"]+"' server.go | head -n1 | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "Backend version extraction failed" >&2
            exit 1
          fi

          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/rm-map-backend"
          SHA_TAG="${GITHUB_SHA::12}"

          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
            echo "sha_tag=$SHA_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Publish summary
        run: |
          {
            echo "### Backend image published"
            echo '- Image: `${{ steps.meta.outputs.image }}`'
            echo '- Tags: `${{ steps.meta.outputs.sha_tag }}`, `${{ steps.meta.outputs.version }}`, `latest`'
          } >> "$GITHUB_STEP_SUMMARY"
