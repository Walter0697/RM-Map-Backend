[app]
environment="development"
port="1998"
jwtkey=""
allowedorigin=""
authmode="local-password" # local-password or oidc
authsessionttlseconds=31536000 # default auth session lifetime policy (one year)

[database]
host=""
port="5432"
dbname="mapmarker"
username=""
password=""

[redis]
enable=false
host="localhost"
port="6379"
password=""
db=0

[authstate]
migrationmode="dual-write" # dual-write | redis-primary | postgres-off
keyprefix="auth:v1"
sessionttlseconds=31536000
redisdialtimeoutms=1500
redisreadtimeoutms=1500
rediswritetimeoutms=1500

[ldap]
enable=true
basedn=""
binddn=""
port="389"
host="localhost"
bindpassword=""
filter="(uid=%s)"
defaultrole="user"
sessionttlseconds=31536000 # Authentik/provider session lifetime target (optional; keep aligned with app.authsessionttlseconds)
accesstokenttlseconds=31536000 # provider access token/session lifetime target (optional)
refreshtokenttlseconds=31536000 # provider refresh token lifetime target (optional)

[oidc]
enable=false
issuer="" # e.g. http://localhost:9000/application/o/rmmap/
clientid=""
clientsecret=""
redirecturl="http://localhost:1998/auth/oidc/callback"
frontendredirecturl="http://localhost:3000/login"
authendpoint="" # optional override, defaults from issuer discovery
tokenendpoint="" # optional override, defaults from issuer discovery
userinfoendpoint="" # optional override, defaults from issuer discovery
scopes=["openid","profile","email"]
usernameclaim="preferred_username"
defaultrole="user"

[calendargoogle]
enable=false
clientid=""
clientsecret=""
redirecturl="http://localhost:1998/calendar/google/callback"
frontendredirecturl="http://localhost:3000/schedules"
authendpoint="https://accounts.google.com/o/oauth2/v2/auth"
tokenendpoint="https://oauth2.googleapis.com/token"
apibaseurl="https://www.googleapis.com/calendar/v3"
scopes=["https://www.googleapis.com/auth/calendar.events"]

[apikey]
moviedb=""
tomtommap=""
tomtomrouting=""
tomtomstaticimage=""
yelp=""

[scheduletravel]
enable=false
baseurl="https://api.tomtom.com/routing/1"
timeoutms=3000
easythresholdminutes=20
difficultthresholdminutes=45

[tomtomroute]
baseurl="https://api.tomtom.com/routing/1"
timeoutms=3500
retrycount=1

[tomtomstaticimage]
baseurl="https://api.tomtom.com/map/1/staticimage"
timeoutms=8000
retrycount=2

[weather]
enable=false
provider="open_meteo"
baseurl="https://api.open-meteo.com"
timeoutms=5000
ratelimitperminute=120
cachettlseconds=600
stalettlseconds=3600
maxforecasthours=192
maxviewportspan=30
maxviewportpointstep=0.2

[integrationauth]
enablecleanup=true
logretentiondays=30
maxauditlogrows=200000
revokedkeyretentiondays=30
cleanupintervalhours=24

[socialmediaanalysis]
enable=false
runnerurl="http://wcodex.home"
workerintervalseconds=15
sourcemaxbytes=5242880
runnertimeoutseconds=600

[googlemaps]
enable=false
baseurl="https://places.googleapis.com"
timeoutms=5000
maxresults=5
apikey=""

[phoenix]
enable=false
endpoint="http://phoenix.home"
project="roroadmap-social-analysis"
apikey=""
apikeyenv="PHOENIX_API_KEY"
timeoutms=5000
batchsize=64

[minio]
enable=false
endpoint="minio.home:9000"
region="us-east-1"
bucket="roroadmap-social-analysis"
accesskey=""
accesskeyenv="MINIO_ACCESS_KEY"
secretkey=""
secretkeyenv="MINIO_SECRET_KEY"
timeoutms=10000
maxbytes=26214400

[infisical]
enable=false
siteurl="https://app.infisical.com"
projectid=""
environment="dev"
secretpath="/roroadmap"
clientid=""
clientsecret=""
clientsecretenv="INFISICAL_CLIENT_SECRET"
apifytoken=""
apifytokenenv="APIFY_TOKEN"
geminitoken=""
geminitokenenv="GEMINI_TOKEN"
apifyactorid=""
apifybaseurl="https://api.apify.com"

[seed]
enableSeed=true
markerNums=20
scheduleDays=10
markerRelationId=1
createUserId=1
centerLatitude=0
centerLongitude=0
centerOffset=0.01
