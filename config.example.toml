[app]
environment="development"
port="1998"
jwtkey=""
allowedorigin=""
authmode="local-password" # local-password or oidc

[database]
host=""
port="5432"
dbname="mapmarker"
username=""
password=""

[ldap]
enable=true
basedn=""
binddn=""
port="389"
host="localhost"
bindpassword=""
filter="(uid=%s)"
defaultrole="user"

[oidc]
enable=false
issuer="" # e.g. http://localhost:9000/application/o/rmmap/
clientid=""
clientsecret=""
redirecturl="http://localhost:1998/auth/oidc/callback"
frontendredirecturl="http://localhost:3000/login"
authendpoint="" # optional override, defaults from issuer discovery
tokenendpoint="" # optional override, defaults from issuer discovery
userinfoendpoint="" # optional override, defaults from issuer discovery
scopes=["openid","profile","email"]
usernameclaim="preferred_username"
defaultrole="user"

[apikey]
moviedb=""
tomtommap=""

[integrationauth]
enablecleanup=true
logretentiondays=30
maxauditlogrows=200000
revokedkeyretentiondays=30
cleanupintervalhours=24

[seed]
enableSeed=true
markerNums=20
scheduleDays=10
markerRelationId=1
createUserId=1
centerLatitude=0
centerLongitude=0
centerOffset=0.01
